name: Verify canonical forge event feed
on:
  push:
    branches: [tooling/event-feed-verify-20260915]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      RCH_CARGO_WRAPPER_BYPASS: '1'
      CARGO_BUILD_JOBS: '1'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_TARGET_DIR: /tmp/fg-event-feed-verify
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: aaacf8a3dbebb5eccc999fc48ec94f3e31282ed0
          persist-credentials: false
      - run: git rev-parse HEAD && rustc -Vv
      - run: cargo check --locked -p fgit-cli --all-targets
      - run: cargo test --locked -p fgit-admission --lib feed -- --nocapture
      - run: cargo test --locked -p fgit-cli --bin fg events::tests -- --nocapture
      - run: cargo test --locked -p fgit-node --lib treefs_workspace::events::tests -- --nocapture --test-threads=1
      - run: git diff --exit-code && test -z "$(git status --porcelain)"
