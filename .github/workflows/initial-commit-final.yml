name: Reviewed initial commit end to end
on:
  push:
    branches: [tooling/initial-cli-finish-896dfd6a]
    paths: [.github/workflows/initial-commit-final.yml]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      source: ${{ steps.apply.outputs.source }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - id: apply
        run: |
          python3 - <<'PY'
          import base64,zlib,hashlib,pathlib,subprocess,os
          patch=zlib.decompress(base64.b64decode(''.replace('LpJJzl','LpJzl')))
          assert hashlib.sha256(patch).hexdigest()=='191dd397af1229d2c1a5b20e8cb6f6cd7dedd340143d7279c1380cb1b27e96fc'
          pathlib.Path('/tmp/initial-adversarial.patch').write_bytes(patch)
          subprocess.run(['git','worktree','add','--detach','/tmp/initial-final','9ebaf23e4d93200184444d0cc1cc0512abaf7222'],check=True)
          os.chdir('/tmp/initial-final')
          target='crates/fgit-node/src/treefs_workspace/initial_commit/tests.rs'
          assert subprocess.check_output(['git','hash-object',target],text=True).strip()=='0fddf2b09d567bb12e01388e1d22f2d025aaffa4'
          subprocess.run(['git','apply','--index','/tmp/initial-adversarial.patch'],check=True)
          assert subprocess.check_output(['git','hash-object',target],text=True).strip()=='e9bc10df75b135ab240e94d144b4e07d8034c515'
          subprocess.run(['git','diff','--cached','--check'],check=True)
          subprocess.run(['git','-c','user.name=Jeff Emanuel','-c','user.email=35050222+Dicklesworthstone@users.noreply.github.com','commit','-m','test(node): reject unreviewed objects and borrowed initial dependencies','-m','Use actual native packs with valid advertisements/checksums to challenge the first-commit boundary. Reject unreachable extra blobs, parented history and incomplete bundles even after dependencies exist in storage. Pair with a permitted complete root on both hash domains and require canonical state preservation.'],check=True)
          sha=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          subprocess.run(['git','push','origin','HEAD:refs/heads/tooling/initial-final-product'],check=True)
          print('SOURCE_COMMIT='+sha)
          with open(os.environ['GITHUB_OUTPUT'],'a') as out: out.write('source='+sha+'\n')
          PY
  native:
    needs: prepare
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      RCH_CARGO_WRAPPER_BYPASS: '1'
      CARGO_BUILD_JOBS: '1'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_TARGET_DIR: /tmp/initial-final-target
      RUST_BACKTRACE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.prepare.outputs.source }}
          persist-credentials: false
      - name: Execute repository-owned native commands
        run: |
          set +e
          set -uo pipefail
          out="$RUNNER_TEMP/initial-evidence"
          mkdir -p "$out"
          git rev-parse HEAD > "$out/revision.txt"
          rustc -Vv > "$out/rustc.txt"
          bash scripts/verify_initial_commit.sh check > "$out/check.log" 2>&1
          a=$?
          tail -n 100 "$out/check.log"
          bash scripts/verify_initial_commit.sh test > "$out/test.log" 2>&1
          b=$?
          tail -n 160 "$out/test.log"
          cargo test --locked -p fgit-diff --lib octal_tests -- --nocapture > "$out/octal.log" 2>&1
          c=$?
          tail -n 60 "$out/octal.log"
          printf 'check=%s test=%s octal=%s\n' "$a" "$b" "$c" > "$out/exit.txt"
          test "$a" = 0 && test "$b" = 0 && test "$c" = 0
      - name: Retain exact source and executable when built
        if: always()
        run: |
          set -eu
          out="$RUNNER_TEMP/initial-evidence"
          mkdir -p "$out"
          git status --porcelain > "$out/status.txt"
          git archive HEAD --format=tar.gz --output="$out/source.tar.gz"
          if test -x "$CARGO_TARGET_DIR/debug/fg"; then cp "$CARGO_TARGET_DIR/debug/fg" "$out/fg"; fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: initial-commit-final-${{ needs.prepare.outputs.source }}
          path: ${{ runner.temp }}/initial-evidence
          retention-days: 1
          if-no-files-found: error
