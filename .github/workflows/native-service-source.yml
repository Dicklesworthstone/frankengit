name: Native service source
on:
  push:
    branches: [tooling/native-service-43a97bd]
    paths: [.github/workflows/native-service-source.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 43a97bd32d3fc92927666c07fdb90c8c7c9d0244
          persist-credentials: false
      - run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/fg-source"
          git rev-parse HEAD > "$RUNNER_TEMP/fg-source/revision.txt"
          git archive HEAD --format=tar.gz --output="$RUNNER_TEMP/fg-source/source.tar.gz"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-service-source-43a97bd
          path: ${{ runner.temp }}/fg-source
          retention-days: 1
          if-no-files-found: error
