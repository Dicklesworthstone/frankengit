name: Index maintenance progress
on:
  push:
    branches: [main]
    paths:
      - 'crates/fgit-node/src/bin/index_maintenance/**'
      - 'scripts/verify_index_maintenance.sh'
      - '.github/workflows/index-maintenance.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  progress:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install repository-pinned toolchain
        run: rustup toolchain install nightly-2026-08-31 --profile minimal
      - name: Execute repository-owned progress tests
        run: ./scripts/verify_index_maintenance.sh
