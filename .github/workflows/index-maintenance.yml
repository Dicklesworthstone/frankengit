name: Index maintenance progress
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  progress:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # actions/checkout v4.2.2
      - name: Install repository-pinned toolchain
        run: rustup toolchain install nightly-2026-08-31 --profile minimal
      - name: Execute repository-owned progress lane
        run: ./scripts/verify.sh index-maintenance
