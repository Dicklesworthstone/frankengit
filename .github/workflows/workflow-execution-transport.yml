name: Workflow execution native work
on:
  push:
    branches: [tooling/workflow-execution-4bac5390]
    paths: [.github/workflows/workflow-execution-transport.yml]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      source: ${{ steps.prepare.outputs.source }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - id: prepare
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,gzip,hashlib,os,pathlib,subprocess
          payload=''
          # Correct a single transport transcription byte only; the complete
          # decompressed source hash remains the acceptance boundary.
          payload=payload.replace('LGdbWSWjue','LGdbWSjue')
          patch=gzip.decompress(base64.b64decode(payload,validate=True))
          assert hashlib.sha256(patch).hexdigest()=='11f465f66eb2e5849f23a7b310a739b34aac431fe8d977c61d210db508b0863d'
          run=lambda *args: subprocess.check_output(args,text=True).strip()
          base='4bac5390d902c53fb59803d01a592ac28dae425f'
          subprocess.run(['git','checkout','--detach',base],check=True)
          assert run('git','rev-parse','HEAD:crates/fgit-runner/src/lib.rs')=='0c751289b71525774f1872d2bb0b8351b62ea120'
          subprocess.run(['git','apply','--check','-'],input=patch,check=True)
          subprocess.run(['git','apply','-'],input=patch,check=True)
          subprocess.run(['git','diff','--check'],check=True)
          subprocess.run(['git','config','user.name','Jeff Emanuel'],check=True)
          subprocess.run(['git','config','user.email','35050222+Dicklesworthstone@users.noreply.github.com'],check=True)
          subprocess.run(['git','add','crates/fgit-runner/src/lib.rs','crates/fgit-runner/tests/settlement.rs'],check=True)
          subprocess.run(['git','commit','-m','fix(runner): settle rejected terminal outputs without leaking leases or capacity (FG-095b)'],check=True)
          source=run('git','rev-parse','HEAD')
          subprocess.run(['git','push','origin',source+':refs/heads/tooling/workflow-settlement-product-4bac5390'],check=True)
          pathlib.Path(os.environ['GITHUB_OUTPUT']).open('a').write('source='+source+'\n')
          print('PRODUCT_SOURCE='+source)
          PY
  native:
    needs: prepare
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    env:
      RCH_CARGO_WRAPPER_BYPASS: '1'
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_TARGET_DIR: /tmp/fg-workflow-settlement
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.prepare.outputs.source }}
          persist-credentials: false
      - run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/evidence"
          git rev-parse HEAD | tee "$RUNNER_TEMP/evidence/revision.txt"
          rustc -Vv | tee "$RUNNER_TEMP/evidence/rustc.txt"
          cargo test -p fgit-runner --test settlement 2>&1 | tee "$RUNNER_TEMP/evidence/settlement.log"
          cargo test -p fgit-runner --lib 2>&1 | tee "$RUNNER_TEMP/evidence/runner.log"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: workflow-settlement-${{ needs.prepare.outputs.source }}
          path: ${{ runner.temp }}/evidence
          retention-days: 1
