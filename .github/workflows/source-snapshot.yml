name: Native branch verification
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/source-snapshot.yml
      - crates/fgit-node/src/treefs_workspace/branches/**
      - crates/fgit-node/src/treefs_workspace/branches.rs
      - crates/fgit-cli/src/branches/**
      - crates/fgit-cli/src/branches.rs
      - crates/fgit-cli/tests/native_branch_smoke.rs
      - scripts/e2e/branch_smoke.py
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    env:
      RCH_CARGO_WRAPPER_BYPASS: '1'
      CARGO_BUILD_JOBS: '2'
      CARGO_TARGET_DIR: /tmp/fg-branch-native
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Check native integration including test targets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/fg-branch-evidence"
          git rev-parse HEAD | tee "$RUNNER_TEMP/fg-branch-evidence/revision.txt"
          rustc -Vv | tee "$RUNNER_TEMP/fg-branch-evidence/rustc.txt"
          set +e
          cargo check --locked -p fgit-node -p fgit-cli --all-targets > "$RUNNER_TEMP/fg-branch-evidence/check.log" 2>&1
          code=$?
          echo "$code" > "$RUNNER_TEMP/fg-branch-evidence/check.exit"
          tail -n 160 "$RUNNER_TEMP/fg-branch-evidence/check.log"
          exit "$code"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: branch-native-${{ github.sha }}
          path: ${{ runner.temp }}/fg-branch-evidence
          if-no-files-found: error
          retention-days: 1
