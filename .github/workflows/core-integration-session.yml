name: Exact core integration workbench
on:
  push:
    branches: [tooling/core-integration-9c8d0521]
    paths:
      - .github/workflows/core-integration-session.yml
      - tools/core-fetch-work/prepare.py
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      source: ${{ steps.prepare.outputs.source }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - id: prepare
        run: python3 tools/core-fetch-work/prepare.py
  verify:
    needs: prepare
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    env:
      RCH_CARGO_WRAPPER_BYPASS: '1'
      CARGO_BUILD_JOBS: '1'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_TARGET_DIR: /tmp/fg-core-integration
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.prepare.outputs.source }}
          persist-credentials: false
      - name: Native check and bundle tests at exact source
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD | tee "$RUNNER_TEMP/fetch-source.txt"
          bash scripts/verify_native_bundle.sh check 2>&1 | tee "$RUNNER_TEMP/fetch-check.log"
          bash scripts/verify_native_bundle.sh test 2>&1 | tee "$RUNNER_TEMP/fetch-test.log"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: core-fetch-native
          path: ${{ runner.temp }}/fetch-*
          retention-days: 1
