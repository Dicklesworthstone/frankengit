name: Initial octal correction
on:
  push:
    branches: [tooling/native-integration-4bac5390]
    paths: [.github/workflows/initial-octal-fix.yml]
permissions:
  contents: write
jobs:
  source:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - run: |
          python3 - <<'PY'
          import base64,zlib,hashlib,pathlib,subprocess,os
          data=''
          data=data.replace('LP86J8dh9','LP86J8Jdh9')
          patch=zlib.decompress(base64.b64decode(data))
          assert hashlib.sha256(patch).hexdigest()=='fd26825af97fc612c775d2aa9af75334118cb700d3c91ebc9cba404097399685'
          pathlib.Path('/tmp/octal.patch').write_bytes(patch)
          subprocess.run(['git','worktree','add','--detach','/tmp/octal-source','ab7615cc38498f22e18093dab223614e8b7ad6bc'],check=True)
          os.chdir('/tmp/octal-source')
          subprocess.run(['git','apply','--index','/tmp/octal.patch'],check=True)
          expected={'crates/fgit-diff/src/patch.rs':'8426668e17a4710e4eb7fa18626f54797dd133a8','crates/fgit-diff/src/patch/octal_tests.rs':'0e28564aa756d883e5e72378ea07cb8db966334e'}
          for name,sha in expected.items(): assert subprocess.check_output(['git','hash-object',name],text=True).strip()==sha
          subprocess.run(['git','diff','--cached','--check'],check=True)
          subprocess.run(['git','-c','user.name=Jeff Emanuel','-c','user.email=35050222+Dicklesworthstone@users.noreply.github.com','commit','-m','fix(diff): decode octal path bytes without intermediate overflow','-m','Native initial-commit testing at ab7615c exposed a checked-arithmetic panic for quoted high-byte paths. Subtract the final octal digit offset before summation and test all 256 byte values, malformed escapes and an actual high-byte creation patch. No path policy, assertion or input validation is weakened.'],check=True)
          subprocess.run(['git','push','origin','HEAD:refs/heads/tooling/initial-octal-product'],check=True)
          print(subprocess.check_output(['git','rev-parse','HEAD'],text=True))
          PY
