          fi

      - name: Reconcile agent-facing documentation and implementation status
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B work origin/main
          cat > docs/AGENT_CONTEXT_SNAPSHOT.md <<'DOC'
          # Revision-bound agent context snapshots

          `scripts/agent_context_snapshot.sh` gives humans and coding agents one
          stable, read-only entry point for establishing what they are actually
          looking at before they plan or mutate anything.

          ```bash
          scripts/agent_context_snapshot.sh /tmp/frankengit-context
          FGIT_AGENT_SNAPSHOT_SOURCE=1 \
            scripts/agent_context_snapshot.sh /tmp/frankengit-context-with-source
          ```

          The command observes dirty state before it creates its staging path,
          then captures the exact Git revision and branch, worktree/index
          summaries, the 50 most recent commits, hashes of the governing files,
          toolchain and platform identity, and authoritative ready/open/
          in-progress/batch-pending bead views when `br` is available. The ready
          view also produces `beads-next-work.json` through the deterministic
          selection contract in `docs/AGENT_NEXT_WORK.md`.

          The optional source archive is produced by `git archive`, so it
          contains exactly the tracked tree selected by the recorded revision.
          Untracked files and the snapshot's own staging path cannot leak into
          that archive.

          `manifest.json` is written last, after `SUMMARY.md`, and SHA-256 binds
          every other regular payload file in the directory. An existing
          destination is never replaced, and the sibling staging directory is
          removed after any failed capture. The command never updates a bead,
          checks out another ref, or writes into the repository unless the caller
          deliberately chooses a destination there.

          This is an observation artifact, not another authority plane. The Git
          ref and `.beads/issues.jsonl` remain authoritative in their respective
          domains; a snapshot merely makes their observed state cheap to hand to
          another agent without losing revision provenance.

          ## Contract verification

          `scripts/tests/agent_context_snapshot.sh` exercises clean and dirty
          disclosure, the in-worktree default, immutable-destination refusal,
          root-last hash binding, operation without `br`, and exclusion of
          untracked files from the optional tracked-source archive. The hosted
          snapshot lane runs this test before publishing an artifact.
          DOC

          python3 - <<'PY'
          from pathlib import Path

          readme = Path('README.md')
          text = readme.read_text()
          if '## Agent context bootstrap' not in text:
              marker = '## Current one-node integration boundary\n'
              note = '''## Agent context bootstrap

Before planning or mutating a checkout, run
[`scripts/agent_context_snapshot.sh`](scripts/agent_context_snapshot.sh) to bind
its revision, pre-capture dirty state, recent history, toolchain,
governing-file hashes, and authoritative bead queues into one root-last
observation artifact. See
[`docs/AGENT_CONTEXT_SNAPSHOT.md`](docs/AGENT_CONTEXT_SNAPSHOT.md). A
deterministic read-only shortlist of unassigned ready work is available through
[`scripts/agent_next_work.sh`](scripts/agent_next_work.sh); see
[`docs/AGENT_NEXT_WORK.md`](docs/AGENT_NEXT_WORK.md). These artifacts are
explicitly non-authoritative.

'''
              if marker not in text:
                  raise SystemExit('README agent bootstrap insertion point changed')
              text = text.replace(marker, note + marker, 1)
          text = text.replace('### Reality snapshot: 2026-08-29', '### Reality snapshot: 2026-09-04', 1)
          readme.write_text(text)

          agents = Path('AGENTS.md')
          a = agents.read_text()
          if '## Agent context bootstrap helper' not in a:
              a = a.rstrip() + '''

## Agent context bootstrap helper

`scripts/agent_context_snapshot.sh` is the canonical read-only bootstrap helper
for revision provenance, pre-capture dirty-state disclosure, recent history,
governing-file hashes, authoritative bead queues, and deterministic next-work
shortlists. Its `manifest.json` is a root-last observation marker, not
repository authority. See `docs/AGENT_CONTEXT_SNAPSHOT.md` and
`docs/AGENT_NEXT_WORK.md`.
'''
              agents.write_text(a + '\n')

          changelog = Path('CHANGELOG.md')
          if not changelog.exists():
              changelog.write_text('# Changelog\n\n## Unreleased\n')
          c = changelog.read_text()
          entries = [
              '- Exposed a strict finite git-daemon session timeout profile through `fg serve`.\n',
              '- Separated peer-controlled receive ingress from the fresh finite deadline used for server-owned validation and sealing.\n',
              '- Added atomic, root-last revision-bound agent context snapshots with adversarial contract tests.\n',
              '- Added deterministic, replayable next-work shortlists derived from the authoritative unassigned ready queue.\n',
              '- Added a zero-dependency gate that keeps Rust bootstrap URLs synchronized with `rust-toolchain.toml`.\n',
          ]
          if '## Unreleased' not in c:
              c = '# Changelog\n\n## Unreleased\n\n' + c
          marker = '## Unreleased\n'
          insertion = ''.join(entry for entry in entries if entry not in c)
          if insertion:
              c = c.replace(marker, marker + '\n' + insertion, 1)
          changelog.write_text(c)

          status_candidates = sorted(Path('.').glob('**/*IMPLEMENTATION*STATUS*.md'))
          status_path = status_candidates[0] if status_candidates else Path('docs/IMPLEMENTATION_STATUS.md')
          section = '''## 2026-09-04 mainline reality

- Raw git-daemon receive-pack is opt-in through an explicit operator principal and reaches quarantine, validation, sealed admission, authority-head publication, and report-status.
- `fg serve` accepts a strict non-zero finite timeout override through `FGIT_GIT_DAEMON_SESSION_TIMEOUT_SECONDS`; malformed and zero values fail closed.
- Peer-controlled receive ingress and server-owned processing use distinct origins for the same finite profile. Automatic byte/work-proportional scaling is not claimed complete.
- The large first-push drill selects its finite timeout explicitly instead of depending on build-profile speed.
- Revision-bound context snapshots, deterministic next-work shortlists, and Rust-pin consistency checks form a read-only agent bootstrap layer without creating a new authority plane.
- Smart HTTP, production SSH, the native API gateway, projections, search, full forge product surfaces, and release publication remain incomplete.
'''
          if status_path.exists():
              s = status_path.read_text()
              if '## 2026-09-04 mainline reality' not in s:
                  if s.startswith('# '):
                      pos = s.find('\n') + 1
                      s = s[:pos] + '\n' + section + '\n' + s[pos:]
