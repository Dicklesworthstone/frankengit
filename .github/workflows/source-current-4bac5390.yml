name: Read saved incremental implementation
on:
  push:
    branches: [tooling/source-current-4bac5390]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: c47f6451377335890038834fac4091ea44a600d7
          fetch-depth: 0
          persist-credentials: false
      - run: |
          mkdir -p "$RUNNER_TEMP/source"
          git rev-parse HEAD > "$RUNNER_TEMP/source/revision.txt"
          git archive HEAD --format=tar.gz --output="$RUNNER_TEMP/source/candidate.tar.gz"
          git diff --binary --full-index 6f111e9d3f4491853f0fd9d20be0cf4ef675b47a HEAD > "$RUNNER_TEMP/source/implementation.patch"
          git archive 6f111e9d3f4491853f0fd9d20be0cf4ef675b47a --format=tar.gz --output="$RUNNER_TEMP/source/base.tar.gz"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: incremental-source-c47f6451
          path: ${{ runner.temp }}/source
          retention-days: 1
          if-no-files-found: error
