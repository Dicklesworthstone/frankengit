name: Native continuation source
on:
  push:
    branches: [tooling/native-continuation-4ff36797]
    paths: [.github/workflows/native-continuation-snapshot.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 4ff367973c805f98a6e81ed32fb469bce31c2e97
          persist-credentials: false
      - run: |
          mkdir -p "$RUNNER_TEMP/source"
          git rev-parse HEAD > "$RUNNER_TEMP/source/revision.txt"
          git archive HEAD --format=tar.gz --output="$RUNNER_TEMP/source/source.tar.gz"
          sha256sum "$RUNNER_TEMP/source/source.tar.gz"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-source-4ff36797
          path: ${{ runner.temp }}/source
          retention-days: 1
          if-no-files-found: error
