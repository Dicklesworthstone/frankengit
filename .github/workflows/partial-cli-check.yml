name: Partial clone CLI integration check
on:
  push:
    branches: [tooling/partial-cli-cb40dd24]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RCH_CARGO_WRAPPER_BYPASS: '1'
      CARGO_BUILD_JOBS: '2'
      CARGO_TARGET_DIR: /tmp/frankengit-partial-cli-check
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 7207128f639669b65e2d51eb6ba71b7181751107
      - name: Check actual command-line package with its required native crypto dependency
        run: |
          test "$(git rev-parse HEAD)" = 7207128f639669b65e2d51eb6ba71b7181751107
          cargo check --locked -p fgit-cli --all-targets
          test -z "$(git status --porcelain)"
      - name: Exercise command-line behavior and binary integration
        run: |
          cargo test --locked -p fgit-cli --all-targets
          test -z "$(git status --porcelain)"
