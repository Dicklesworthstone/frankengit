name: Verify native fetch, replay, and candidate inspection
on:
  push:
    branches: [tooling/upload-visibility-e81b6319]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PAYLOAD_SHA: ${{ github.sha }}
      CARGO_BUILD_JOBS: '2'
    steps:
      - name: Check out the exact prepared implementation
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 42b5117b09ef2f816cf51ff0932b7947955189f0
          fetch-depth: 0
      - name: Restore existing module integration and strengthen fetch twins
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/upload-visibility"
          mkdir -p "$out"
          git rev-parse HEAD > "$out/base.txt"
          git fetch origin "$PAYLOAD_SHA"
          for name in integration strengthen; do
            git show "$PAYLOAD_SHA:.visibility-payload/$name.py" > "$RUNNER_TEMP/$name.py"
            python "$RUNNER_TEMP/$name.py" | tee "$out/$name.log"
          done
          rustfmt --edition 2024 --config skip_children=true crates/fgit-node/src/upload_visibility/tests.rs
          git diff --check
          git diff --exit-code -- Cargo.toml Cargo.lock .beads .github
          git config user.name 'Jeff Emanuel'
          git config user.email '35050222+Dicklesworthstone@users.noreply.github.com'
          git add crates/fgit-node/src/treefs_workspace/commit_replay.rs crates/fgit-node/src/treefs_workspace/bundle_review.rs crates/fgit-node/src/treefs_workspace/publication.rs crates/fgit-node/src/treefs_workspace/reviews.rs
          test "$(git diff --cached --name-only | wc -l)" = 4
          git commit -m 'fix(node): connect replay and bundle inspection implementations and tests' -m 'Explicit child paths preserve the real pack reader and existing replay, resolution, and inspection tests beneath relocated path-attributed modules. Export the existing inspection refusal only to the workspace parent and route review integration through that actual module. No tests, assertions, or functionality are disabled. Native execution results are captured by the preparation run.'
          git rev-parse HEAD > "$out/integration-result.txt"
          git add crates/fgit-node/src/upload_visibility/tests.rs
          test "$(git diff --cached --name-only)" = crates/fgit-node/src/upload_visibility/tests.rs
          git commit -m 'test(fetch): exercise hidden policy and actual common-have acknowledgment branches' -m 'Drive protocol-v2 acknowledgments instead of suppressing all ACKs with done. Pair forbidden deleted-only haves with genuinely common visible ancestors, requiring correct ACK and exact three-object pack subtraction in v0/v1/v2 and both hash domains. Test hidden-ref rules through the actual snapshot adapter before visible graph derivation. Nine visibility tests are registered; passing execution is not asserted by this commit.'
          git rev-parse HEAD > "$out/result.txt"
          git status --porcelain | tee "$out/status.txt"
          test ! -s "$out/status.txt"
          git push origin "HEAD:refs/heads/tooling/upload-visibility-result-${PAYLOAD_SHA:0:12}"
      - name: Execute native visibility regressions
        shell: bash
        run: |
          set +e
          set -uo pipefail
          out="$RUNNER_TEMP/upload-visibility"
          rustc -Vv > "$out/rustc.txt"
          timeout 600 cargo test --locked -p fgit-node --lib upload_visibility::tests -- --nocapture > "$out/native.log" 2>&1
          result=$?
          echo "$result" | tee "$out/native.exit"
          tail -n 160 "$out/native.log"
          exit 0
      - name: Execute restored replay and candidate inspection paths
        shell: bash
        run: |
          set +e
          set -uo pipefail
          out="$RUNNER_TEMP/upload-visibility"
          if [ "$(cat "$out/native.exit")" != 0 ]; then exit 0; fi
          for selector in treefs_workspace::merge_prepare::commit_replay treefs_workspace::publication::bundle_review; do
            name="${selector##*::}"
            timeout 180 cargo test --locked -p fgit-node --lib "$selector" -- --nocapture > "$out/$name.log" 2>&1
            echo "$?" > "$out/$name.exit"
            tail -n 80 "$out/$name.log"
          done
          exit 0
      - name: Run node integration coverage without stopping on the first failing target
        shell: bash
        run: |
          set +e
          set -uo pipefail
          out="$RUNNER_TEMP/upload-visibility"
          if [ "$(cat "$out/native.exit")" != 0 ]; then exit 0; fi
          timeout 480 cargo test --locked -p fgit-node --all-targets --no-fail-fast > "$out/all-targets.log" 2>&1
          echo "$?" | tee "$out/all-targets.exit"
          tail -n 150 "$out/all-targets.log"
          exit 0
      - name: Retain exact source and verification evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/upload-visibility"
          mkdir -p "$out"
          git status --porcelain > "$out/final-status.txt"
          git diff --check
          git log -n 5 --oneline > "$out/commits.txt"
          tar --exclude=.git --exclude=target -czf "$out/source.tar.gz" .
      - name: Upload native evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: upload-visibility-evidence
          path: ${{ runner.temp }}/upload-visibility
          retention-days: 1
          if-no-files-found: error
