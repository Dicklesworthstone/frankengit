name: Native review protection activation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    env:
      RCH_CARGO_WRAPPER_BYPASS: '1'
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      PYTHONDONTWRITEBYTECODE: '1'
      CARGO_TARGET_DIR: /tmp/fg-review-activation-target
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # actions/checkout v4.2.2
        with:
          persist-credentials: false
      - name: Record tested source and toolchain
        run: |
          git rev-parse HEAD
          rustc -Vv
      - name: Native activation and enforcement lifecycle
        run: ./scripts/verify.sh review-protection
      - name: Admission regression suite
        if: ${{ !cancelled() }}
        run: ./scripts/verify.sh admission-tests
      - name: Preserve test source identity
        if: ${{ !cancelled() }}
        run: |
          git diff --exit-code
          git status --porcelain
