name: Initial commit core
on:
  push:
    branches: [tooling/native-integration-4bac5390]
    paths: [.github/workflows/initial-commit-core.yml]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    outputs:
      source: ${{ steps.apply.outputs.source }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - id: apply
        run: |
          python3 - <<'PY'
          import base64,zlib,hashlib,pathlib,subprocess,os
          p=pathlib.Path('/tmp/initial-core.patch')
          encoded=pathlib.Path('tools/native-integration/core.b64').read_text().replace('Ki hha','KIhha')
          patch=zlib.decompress(base64.b64decode(encoded))
          assert hashlib.sha256(patch).hexdigest()=='206cf2064d0c1974c082db501cce735767891d918d66a75be35ab6dab3c7ead2'
          p.write_bytes(patch)
          subprocess.run(['git','worktree','add','--detach','/tmp/initial-core','4bac5390d902c53fb59803d01a592ac28dae425f'],check=True)
          os.chdir('/tmp/initial-core')
          subprocess.run(['git','apply','--index',str(p)],check=True)
          expected={'crates/fgit-forge/src/lib.rs':'55cd06be0ad9b64bb0063f73e32026889ffc808d','crates/fgit-forge/src/initial_commit.rs':'b2c491cba325cca177a2b3b3aece53bfc4ce467a','crates/fgit-forge/src/initial_commit/tests.rs':'7be4295a7964812578aca4614a9d14be77f0914b'}
          for name,sha in expected.items(): assert subprocess.check_output(['git','hash-object',name],text=True).strip()==sha
          subprocess.run(['git','diff','--cached','--check'],check=True)
          subprocess.run(['git','-c','user.name=Jeff Emanuel','-c','user.email=35050222+Dicklesworthstone@users.noreply.github.com','commit','-m','feat(forge): construct complete native initial commits from exact creation patches (FG-051a)','-m','Creation-only exact patches produce sorted, deduplicated native blobs and trees plus a zero-parent commit. Bound every generated object, validate index prefixes and paths, and preserve deterministic bytes in SHA-1 and SHA-256. Includes positive, refusal, cumulative-budget, raw-path and cancellation tests; native execution is recorded separately.'],check=True)
          sha=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          subprocess.run(['git','push','origin','HEAD:refs/heads/tooling/initial-core-product'],check=True)
          print('SOURCE_COMMIT='+sha)
          with open(os.environ['GITHUB_OUTPUT'],'a') as out: out.write('source='+sha+'\n')
          PY
  check:
    needs: prepare
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      RCH_CARGO_WRAPPER_BYPASS: '1'
      CARGO_BUILD_JOBS: '1'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_TARGET_DIR: /tmp/initial-core-target
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.prepare.outputs.source }}
          persist-credentials: false
      - run: |
          set -o pipefail
          git rev-parse HEAD
          cargo test --locked -p fgit-forge --lib initial_commit -- --nocapture 2>&1 | tee "$RUNNER_TEMP/initial-core.log"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: initial-core-native
          path: ${{ runner.temp }}/initial-core.log
          retention-days: 1
