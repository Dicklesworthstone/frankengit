name: Workflow native environment
on:
  push:
    branches: [tooling/workflow-execution-4bac5390]
    paths: [.github/workflows/workflow-native-environment.yml]
permissions:
  contents: read
jobs:
  environment:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: d8d9d8d9d45f202a83ad789a0e1d7d5e5807e412
          persist-credentials: false
      - run: |
          set -euo pipefail
          rustc -Vv
          cargo fetch --locked
          tc="$(rustc --print sysroot)"
          mkdir -p "$RUNNER_TEMP/native-env"
          tar -czf "$RUNNER_TEMP/native-env/toolchain.tar.gz" -C "$tc" bin/cargo bin/rustc bin/rustfmt lib
          tar -czf "$RUNNER_TEMP/native-env/registry.tar.gz" -C "$HOME/.cargo" registry
          sha256sum "$RUNNER_TEMP/native-env/"*.tar.gz > "$RUNNER_TEMP/native-env/SHA256SUMS"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: frankengit-native-environment-nightly-2026-08-31
          path: ${{ runner.temp }}/native-env
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
