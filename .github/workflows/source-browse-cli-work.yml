name: Source read-patch-publish integration
on:
  push:
    branches: [tooling/exact-source-read-e1b8180e]
    paths: [tools/source-browse-work/cli.b64, tools/source-browse-work/prepare_cli.py, .github/workflows/source-browse-cli-work.yml]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      source: ${{ steps.prepare.outputs.source }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - id: prepare
        run: python3 tools/source-browse-work/prepare_cli.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: browse-cli-transport
          path: tools/source-browse-work
          retention-days: 1
  native:
    needs: prepare
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      RCH_CARGO_WRAPPER_BYPASS: '1'
      CARGO_BUILD_JOBS: '1'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_TARGET_DIR: /tmp/fg-source-browse-native
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.prepare.outputs.source }}
          persist-credentials: false
      - run: |
          set -uo pipefail
          git rev-parse HEAD | tee "$RUNNER_TEMP/browse-revision.log"
          rustc -Vv
          bash scripts/verify_source_browse.sh check 2>&1 | tee "$RUNNER_TEMP/browse-check.log"
          a=$?
          bash scripts/verify_source_browse.sh test 2>&1 | tee "$RUNNER_TEMP/browse-test.log"
          b=$?
          echo "check=$a test=$b" | tee "$RUNNER_TEMP/browse-exit.log"
          test "$a" = 0 && test "$b" = 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: source-browse-cli-native-${{ needs.prepare.outputs.source }}
          path: ${{ runner.temp }}/browse-*.log
          retention-days: 1
