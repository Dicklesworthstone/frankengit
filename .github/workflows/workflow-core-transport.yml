name: Workflow executor source
on:
  push:
    branches: [tooling/workflow-execution-4bac5390]
    paths: [.github/workflows/workflow-core-transport.yml, tools/workflow-core.patch.b64]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,gzip,hashlib,pathlib,subprocess
          encoded=pathlib.Path('tools/workflow-core.patch.b64').read_text().strip()
          patch=gzip.decompress(base64.b64decode(encoded,validate=True))
          assert hashlib.sha256(patch).hexdigest()=='3ff678b5de8235850c0e4be997a57077e5d7c5d7d25082526a96ec0a0b151fa9'
          subprocess.run(['git','checkout','--detach','d8d9d8d9d45f202a83ad789a0e1d7d5e5807e412'],check=True)
          subprocess.run(['git','apply','--check','-'],input=patch,check=True)
          subprocess.run(['git','apply','-'],input=patch,check=True)
          subprocess.run(['git','diff','--check'],check=True)
          subprocess.run(['git','config','user.name','Jeff Emanuel'],check=True)
          subprocess.run(['git','config','user.email','35050222+Dicklesworthstone@users.noreply.github.com'],check=True)
          files=['Cargo.lock','crates/fgit-runner/Cargo.toml','crates/fgit-runner/src/lib.rs','crates/fgit-runner/src/workflow.rs','crates/fgit-runner/src/workflow/process.rs','crates/fgit-runner/tests/workflow_execution.rs']
          subprocess.run(['git','add',*files],check=True)
          subprocess.run(['git','commit','-m','feat(runner): execute trusted workflow DAGs with bounded native steps (FG-095b)'],check=True)
          source=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          subprocess.run(['git','push','origin',source+':refs/heads/tooling/workflow-core-product-d8d9d8d9'],check=True)
          print('PRODUCT_SOURCE='+source)
          subprocess.run(['git','ls-tree','-r','HEAD','--',*files],check=True)
          PY
