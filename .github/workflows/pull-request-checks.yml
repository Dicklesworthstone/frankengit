name: Pull request workflow observations
# Consumers: saved workflow publication and PR checks (.4.12), and continuous
# Git/SSH services (.4.32). Covers canonical binding, retries and bounded drain.
# Remove this standalone job when these targets join the ordinary union job.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pull-request-checks.yml'
      - 'crates/fgit-admission/src/merge/native/workflow_checks/**'
      - 'crates/fgit-node/src/treefs_workspace/pull_request/checks.rs'
      - 'crates/fgit-node/src/treefs_workspace/trusted_workflow/durable/publication/tests/pull_request_checks.rs'
      - 'crates/fgit-node/src/treefs_workspace/trusted_workflow/durable/publication/tests/saved_check_record.rs'
      - 'crates/fgit-node/src/treefs_workspace/trusted_workflow/durable/recovery.rs'
      - 'crates/fgit-node/src/treefs_workspace/trusted_workflow/durable/recovery/**'
      - 'crates/fgit-node/src/smart_http/server/pulls/checks/**'
      - 'crates/fgit-node/src/smart_http/server/pulls/checks.rs'
      - 'crates/fgit-node/src/smart_http/server/browser/pulls-checks.mjs'
      - 'crates/fgit-node/tests/pull_request_checks_http.rs'
      - 'crates/fgit-cli/src/pull_request/checks.rs'
      - 'crates/fgit-cli/src/workflow_command.rs'
      - 'crates/fgit-cli/src/workflow_command/publish.rs'
      - 'crates/fgit-cli/src/workflow_command/publish/**'
      - 'crates/fgit-cli/tests/workflow_publication.rs'
      - 'crates/fgit-cli/src/mcp/backend/checks.rs'
      - 'crates/fgit-cli/src/mcp/backend/integration_tests.rs'
      - 'scripts/e2e/pull_request_smoke.py'
      - 'scripts/e2e/workflow_publication_smoke.py'
      - 'crates/fgit-cli/src/lib.rs'
      - 'crates/fgit-cli/src/main.rs'
      - 'crates/fgit-cli/src/guarded_git_server.rs'
      - 'crates/fgit-cli/src/ssh_server.rs'
      - 'crates/fgit-cli/src/smart_http_server.rs'
      - 'crates/fgit-cli/src/service_stop.rs'
      - 'crates/fgit-node/src/smart_http/receive_session/daemon/supervisor.rs'
      - 'crates/fgit-node/src/ssh.rs'
      - 'crates/fgit-node/src/ssh/**'
      - 'crates/fgit-node/tests/guarded_git_daemon.rs'
      - 'crates/fgit-node/tests/guarded_git_daemon/**'
      - 'scripts/e2e/continuous_git_transports_smoke.py'
      - 'scripts/e2e/continuous_git_proxy.py'
      - 'scripts/e2e/suites/node/continuous_git_transports.sh'
      - 'tests/browser/pulls-checks*.mjs'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pull-request-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: '1'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_HTTP_USER_AGENT: 'OpenAI File Downloader, XaiImageApiFetch/1.0'
      CARGO_TARGET_DIR: /tmp/fg-pull-checks
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Exact source and pinned compiler
        run: |
          git rev-parse HEAD
          rustc -Vv
      - name: Compile production and CLI targets
        run: cargo check --locked -p fgit-cli --all-targets
      - name: Canonical observation selection
        run: cargo test --locked -p fgit-admission --lib workflow_checks::read::tests
      - name: Persisted workflow and PR lifecycle
        run: |
          cargo test --locked -p fgit-node --lib pull_request_checks
          cargo test --locked -p fgit-node --lib saved_check_record
      - name: Run, recover, publish and read canonical checks
        run: |
          cargo test --locked -p fgit-cli --bin fg workflow_command::publish::tests
          cargo test --locked -p fgit-cli --test workflow_publication
      - name: HTTP contracts and actual publication reads
        run: |
          cargo test --locked -p fgit-node --lib smart_http::server::pulls::checks
          cargo test --locked -p fgit-node --test pull_request_checks_http
      - name: CLI and MCP reads
        run: |
          cargo test --locked -p fgit-cli --bin fg checks
          cargo test --locked -p fgit-cli --bin fg mcp::backend::integration_tests
          cargo test --locked -p fgit-cli --test native_pull_request_smoke
      - name: Continuous service ownership and deadlines
        run: |
          cargo test --locked -p fgit-cli --bin fg guarded_git_server::tests
          cargo test --locked -p fgit-cli --bin fg ssh_server::tests
          cargo test --locked -p fgit-cli --bin fg service_stop::tests
          cargo test --locked -p fgit-node --lib daemon::supervisor::tests
          cargo test --locked -p fgit-node --lib ssh::
          cargo test --locked -p fgit-node --test guarded_git_daemon continuous
      - name: Stock Git continuous clone fetch push and signal drain
        run: python3 scripts/e2e/continuous_git_transports_smoke.py --fg "$CARGO_TARGET_DIR/debug/fg" --format sha1 --format sha256
      - name: SSH quiet-command and transport compatibility
        run: FG_BIN="$CARGO_TARGET_DIR/debug/fg" bash scripts/e2e/suites/transport/ssh_git_compat.sh
      - name: Browser observation protocol and panel
        run: node --test tests/browser/pulls-checks*.test.mjs
