name: Pull request workflow observations and continuous Git services
# Consumers: saved workflow publication and PR checks (.4.12), and continuous
# Git/SSH services (.4.32). A dispatch manifest only: the checks themselves are
# the repository-owned verify.sh lanes, runnable locally (AGENTS.md section 12).
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: '1'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_HTTP_USER_AGENT: 'OpenAI File Downloader, XaiImageApiFetch/1.0'
      CARGO_TARGET_DIR: /tmp/fg-pull-checks
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Canonical workflow observations on pull requests
        run: ./scripts/verify.sh pull-request-checks
      - name: Continuous Git and SSH services
        if: ${{ !cancelled() }}
        run: ./scripts/verify.sh continuous-serve
