name: Native fetch continuation
on:
  push:
    branches: [tooling/fetch-progress-20260912]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      source: ${{ steps.prepare.outputs.source }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - id: prepare
        run: python3 tools/fetch-continuation/prepare.py
  verify:
    needs: prepare
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      RCH_CARGO_WRAPPER_BYPASS: '1'
      CARGO_BUILD_JOBS: '2'
      CARGO_TARGET_DIR: /tmp/fg-fetch-progress-target
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.prepare.outputs.source }}
          persist-credentials: false
      - run: cargo test --locked -p fgit-wire --all-targets
      - run: cargo test --locked -p fgit-node --test git_daemon_v2_fragments --test git_daemon_v2 --test git_daemon_deadline --test hidden_ref_policy_end_to_end
