name: Persistent declaration tables
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tables:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # actions/checkout v4.2.2
      - name: Install repository-pinned toolchain
        run: rustup toolchain install nightly-2026-08-31 --profile minimal
      - name: Execute repository-owned index lane
        run: ./scripts/verify.sh symbol-index
  native-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # actions/checkout v4.2.2
      - name: Install repository-pinned toolchain
        run: rustup toolchain install nightly-2026-08-31 --profile minimal
      - name: Execute repository-owned native index lane
        run: ./scripts/verify.sh symbol-index-native
  maintenance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # actions/checkout v4.2.2
      - name: Install repository-pinned toolchain
        run: rustup toolchain install nightly-2026-08-31 --profile minimal
      - name: Execute repository-owned maintenance lane
        run: ./scripts/verify.sh symbol-index-maintenance
