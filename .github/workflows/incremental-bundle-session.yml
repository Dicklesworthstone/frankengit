name: Native incremental bundle synchronization
on:
  push:
    branches: [tooling/incremental-bundle-session-20260913]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      source: ${{ steps.prepare.outputs.source }}
      core: ${{ steps.prepare.outputs.core }}
      node: ${{ steps.prepare.outputs.node }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - id: prepare
        run: python3 tools/incremental-bundle-session/prepare.py
  verify:
    needs: prepare
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      RCH_CARGO_WRAPPER_BYPASS: '1'
      CARGO_BUILD_JOBS: '1'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      PYTHONDONTWRITEBYTECODE: '1'
      CARGO_TARGET_DIR: /tmp/fg-incremental-bundle-target
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.prepare.outputs.source }}
          persist-credentials: false
      - run: |
          git rev-parse HEAD
          rustc -Vv
          bash scripts/verify_incremental_bundle.sh
      - if: ${{ !cancelled() }}
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain)"
