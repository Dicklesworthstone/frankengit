name: Native fetch cutoff workbench
on:
  push:
    branches: [tooling/fetch-cutoffs-e55985db]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      source: ${{ steps.prepare.outputs.source }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - id: prepare
        shell: python
        run: |
          import pathlib
          path=pathlib.Path('tools/fetch-cutoffs/prepare.py')
          text=path.read_text()
          old="edit(node+'lib.rs','shallow deepen-relative filter include-tag','shallow deepen-relative deepen-since deepen-not filter include-tag')"
          assert text.count(old)==1
          text=text.replace(old,old[:-1]+',10)')
          exec(compile(text,str(path),'exec'))
  verify:
    needs: prepare
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      RCH_CARGO_WRAPPER_BYPASS: '1'
      CARGO_BUILD_JOBS: '2'
      CARGO_TARGET_DIR: /tmp/fg-cutoffs-target
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.prepare.outputs.source }}
          persist-credentials: false
      - run: cargo test --locked -p fgit-wire --all-targets
      - run: cargo test --locked -p fgit-node --lib upload_visibility::shallow
      - run: cargo check --locked -p fgit-cli --all-targets
