name: Native rebase implementation
on:
  push:
    branches: [tooling/rebase-session-20260913]
permissions:
  contents: read
jobs:
  verify-published:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      RCH_CARGO_WRAPPER_BYPASS: '1'
      CARGO_BUILD_JOBS: '2'
      CARGO_TARGET_DIR: /tmp/fg-rebase-published-target
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 7304c7b846331526aa4d876667b38d51a7e063a1
          persist-credentials: false
      - run: cargo fetch --locked
      - run: cargo test --locked --offline -p fgit-cli --test native_rebase_smoke -- --nocapture
      - run: cargo test --locked --offline -p fgit-cli --bin fg rebase
      - run: git diff --exit-code
