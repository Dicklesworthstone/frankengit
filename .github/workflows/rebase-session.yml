name: Native rebase implementation
on:
  push:
    branches: [tooling/rebase-session-20260913]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      source: ${{ steps.prepare.outputs.source }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - id: prepare
        run: python3 tools/rebase-session/prepare.py
  verify:
    needs: prepare
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      RCH_CARGO_WRAPPER_BYPASS: '1'
      CARGO_BUILD_JOBS: '2'
      CARGO_TARGET_DIR: /tmp/fg-rebase-integration-target
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.prepare.outputs.source }}
          persist-credentials: false
      - run: cargo check --locked -p fgit-cli --all-targets
      - run: cargo test --locked -p fgit-node --lib merge_prepare::rebase
      - run: cargo test --locked -p fgit-cli --bin fg rebase
      - run: cargo test --locked -p fgit-forge --lib preparation
