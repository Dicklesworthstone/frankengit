name: local-verification-manifest

# Portable lane description for Doodlestein Self-Releaser / nektos/act.
# FrankenGit does not rely on GitHub-hosted Actions for correctness or release.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Run repository-owned verification lane
        run: ./scripts/verify.sh docs
