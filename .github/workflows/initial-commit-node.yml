name: Initial commit node
on:
  push:
    branches: [tooling/native-integration-4bac5390]
    paths: [.github/workflows/initial-commit-node.yml]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    outputs:
      source: ${{ steps.apply.outputs.source }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - id: apply
        run: |
          python3 - <<'PY'
          import base64,zlib,hashlib,pathlib,subprocess,os
          patch=zlib.decompress(base64.b64decode(pathlib.Path('tools/native-integration/node.b64').read_text()))
          assert hashlib.sha256(patch).hexdigest()=='35e233653cd8fd126f7fa1009c1a44c3e7d2792005aadc532d1a52ad94e40f4d'
          pathlib.Path('/tmp/initial-node.patch').write_bytes(patch)
          subprocess.run(['git','worktree','add','--detach','/tmp/initial-node','1e1aeaa28224c0dbf7f897b7203a19d4edec7ff3'],check=True)
          os.chdir('/tmp/initial-node')
          subprocess.run(['git','apply','--index','/tmp/initial-node.patch'],check=True)
          expected={'crates/fgit-node/src/treefs_workspace.rs':'18226945df63a9c5c44116aefcf432360cc2e25c','crates/fgit-node/src/treefs_workspace/initial_commit.rs':'280d3ecf835769905525d37ec9a2898318b20a8d','crates/fgit-node/src/treefs_workspace/initial_commit/tests.rs':'0fddf2b09d567bb12e01388e1d22f2d025aaffa4'}
          for name,sha in expected.items(): assert subprocess.check_output(['git','hash-object',name],text=True).strip()==sha
          subprocess.run(['git','diff','--cached','--check'],check=True)
          subprocess.run(['git','-c','user.name=Jeff Emanuel','-c','user.email=35050222+Dicklesworthstone@users.noreply.github.com','commit','-m','feat(node): prepare and atomically publish reviewed native initial history (FG-051a)','-m','Prepare a complete root bundle without staging and publish only its independently specified commit at an absent branch. Preserve canonical protection, complete native quarantine, exact scoped-key recovery, cancellation and restart semantics. Include file-backed both-hash creation, race, refusal, quota and policy tests; native execution is recorded separately.'],check=True)
          sha=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          subprocess.run(['git','push','origin','HEAD:refs/heads/tooling/initial-node-product'],check=True)
          print('SOURCE_COMMIT='+sha)
          with open(os.environ['GITHUB_OUTPUT'],'a') as out: out.write('source='+sha+'\n')
          PY
  native:
    needs: prepare
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    env:
      RCH_CARGO_WRAPPER_BYPASS: '1'
      CARGO_BUILD_JOBS: '1'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_TARGET_DIR: /tmp/initial-node-target
      RUST_BACKTRACE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.prepare.outputs.source }}
          persist-credentials: false
      - run: |
          set -o pipefail
          git rev-parse HEAD > "$RUNNER_TEMP/initial-revision.txt"
          cargo test --locked -p fgit-forge --lib initial_commit -- --nocapture 2>&1 | tee "$RUNNER_TEMP/initial-forge.log"
          cargo test --locked -p fgit-node --lib treefs_workspace::initial_commit -- --nocapture 2>&1 | tee "$RUNNER_TEMP/initial-node.log"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: initial-node-native
          path: ${{ runner.temp }}/initial-*
          retention-days: 1
