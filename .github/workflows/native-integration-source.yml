name: Native integration source
on:
  push:
    branches: [tooling/native-integration-4bac5390]
    paths: [.github/workflows/native-integration-source.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 4bac5390d902c53fb59803d01a592ac28dae425f
          persist-credentials: false
      - run: |
          mkdir -p "$RUNNER_TEMP/fgit-source"
          git rev-parse HEAD > "$RUNNER_TEMP/fgit-source/revision.txt"
          git archive HEAD --format=tar.gz --output="$RUNNER_TEMP/fgit-source/source.tar.gz"
          sha256sum "$RUNNER_TEMP/fgit-source/source.tar.gz"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-source-4bac5390
          path: ${{ runner.temp }}/fgit-source
          retention-days: 1
          if-no-files-found: error
