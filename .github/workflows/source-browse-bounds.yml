name: Prepare source read budget correction
on:
  push:
    branches: [tooling/exact-source-read-e1b8180e]
    paths: [tools/source-browse-work/bounds.b64, tools/source-browse-work/prepare_bounds.py, .github/workflows/source-browse-bounds.yml]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - run: python3 tools/source-browse-work/prepare_bounds.py
