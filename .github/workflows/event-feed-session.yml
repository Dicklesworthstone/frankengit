name: Canonical forge event feed
on:
  push:
    branches: [tooling/event-feed-20260915]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-22.04
    timeout-minutes: 6
    permissions:
      contents: write
    outputs:
      source: ${{ steps.prepare.outputs.source }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - id: prepare
        run: python3 tools/event-feed-session/prepare.py
  verify:
    needs: prepare
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      RCH_CARGO_WRAPPER_BYPASS: '1'
      CARGO_BUILD_JOBS: '1'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_TARGET_DIR: /tmp/fg-event-feed
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.prepare.outputs.source }}
          persist-credentials: false
      - run: git rev-parse HEAD && rustc -Vv
      - run: cargo check --locked -p fgit-cli --all-targets
      - run: cargo test --locked -p fgit-admission --lib feed -- --nocapture
      - run: cargo test --locked -p fgit-cli --bin fg events::tests -- --nocapture
      - run: cargo test --locked -p fgit-node --lib forge_event -- --nocapture --test-threads=1
      - run: git diff --exit-code && test -z "$(git status --porcelain)"
