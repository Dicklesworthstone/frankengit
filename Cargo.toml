# FrankenGit workspace.
# Engine crates enter only with a real vertical slice; no placeholder crates.
# Every directory under crates/ is a workspace member via the glob, so it MUST be a complete
# crate: create src/lib.rs (with #![forbid(unsafe_code)]) BEFORE Cargo.toml, and add the
# crate's [workspace.dependencies] path entry below in the same commit.

[workspace]
resolver = "3"
members = ["crates/*", "tools/registry-check"]
default-members = ["crates/*", "tools/registry-check"]

[workspace.package]
edition = "2024"
license-file = "LICENSE"
repository = "https://github.com/Dicklesworthstone/frankengit"

# First-party workspace members are wired by path in exactly one place, so
# every consumer writes `fgit-types.workspace = true` and no crate invents its
# own relative path. This is the layered first-party crate DAG of the plan's
# prospective implementation architecture, admitted by DEP-013 (`fgit-*`,
# allow_first_party) — not the unpublished external path dependency that
# AGENTS.md section 3.3 forbids for a release-facing crate.
[workspace.dependencies]
# The sole async runtime (AGENTS.md 3.2, registries/dependency_policy.tsv DEP-001),
# aliased here so a crate can inherit the one pinned version instead of
# repeating it. Must stay equal to the version the crates that name it
# directly already pin, and to the entry in Cargo.lock.
asupersync = { version = "0.4.9", default-features = false }
# FG-069a / GoldLotus ruling 7613: this direct edge unifies `pure` across
# the fsqlite closure, preventing blake3's host-assembled x86-64 path.
blake3 = { version = "1.8.7", features = ["pure"] }
# Reused cryptographic primitives, admitted for direct first-party use by
# ADR-0003 Amendment 1 (D8). `default-features = false` is load-bearing rather
# than tidy: the default sets add dependency edges (`zeroize` for
# ed25519-dalek, `getrandom` via aead for chacha20poly1305) and would move
# Cargo.lock for every agent sharing this checkout. Signing keys are derived
# through HKDF in fgit-crypto, so in-crate key generation is not needed.
chacha20poly1305 = { version = "0.11.0", default-features = false }
ed25519-dalek = { version = "2.2.0", default-features = false }
fgit-admission = { path = "crates/fgit-admission" }
fgit-agent = { path = "crates/fgit-agent" }
fgit-atp-git = { path = "crates/fgit-atp-git" }
fgit-authority = { path = "crates/fgit-authority" }
fgit-authority-fsqlite = { path = "crates/fgit-authority-fsqlite" }
fgit-benchmark = { path = "crates/fgit-benchmark" }
fgit-calm = { path = "crates/fgit-calm" }
fgit-chronicle = { path = "crates/fgit-chronicle" }
fgit-claim = { path = "crates/fgit-claim" }
fgit-compaction = { path = "crates/fgit-compaction" }
fgit-codec = { path = "crates/fgit-codec" }
fgit-codec-verify = { path = "crates/fgit-codec-verify" }
fgit-crypto = { path = "crates/fgit-crypto" }
fgit-deflate = { path = "crates/fgit-deflate" }
fgit-diff = { path = "crates/fgit-diff" }
fgit-evidence = { path = "crates/fgit-evidence" }
fgit-exchange = { path = "crates/fgit-exchange" }
fgit-forge = { path = "crates/fgit-forge" }
fgit-doc = { path = "crates/fgit-doc" }
fgit-git-object = { path = "crates/fgit-git-object" }
fgit-graph = { path = "crates/fgit-graph" }
fgit-identity = { path = "crates/fgit-identity" }
fgit-lab = { path = "crates/fgit-lab" }
fgit-node = { path = "crates/fgit-node" }
fgit-object-fabric = { path = "crates/fgit-object-fabric" }
fgit-object-store = { path = "crates/fgit-object-store" }
fgit-pack = { path = "crates/fgit-pack" }
fgit-policy = { path = "crates/fgit-policy" }
fgit-projection = { path = "crates/fgit-projection" }
fgit-proof-bridge = { path = "crates/fgit-proof-bridge" }
fgit-raptorq = { path = "crates/fgit-raptorq" }
fgit-repair = { path = "crates/fgit-repair" }
fgit-reference = { path = "crates/fgit-reference" }
fgit-release = { path = "crates/fgit-release" }
fgit-resource = { path = "crates/fgit-resource" }
fgit-runner = { path = "crates/fgit-runner" }
fgit-runtime = { path = "crates/fgit-runtime" }
fgit-schema = { path = "crates/fgit-schema" }
fgit-slo = { path = "crates/fgit-slo" }
fgit-statistics = { path = "crates/fgit-statistics" }
fgit-txn = { path = "crates/fgit-txn" }
fgit-treefs = { path = "crates/fgit-treefs" }
fgit-types = { path = "crates/fgit-types" }
fgit-wire = { path = "crates/fgit-wire" }
fgit-witness = { path = "crates/fgit-witness" }
fgit-verified-read = { path = "crates/fgit-verified-read" }
fgit-cli = { path = "crates/fgit-cli" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
# `T::default()` spelled via Default::default() at generic call sites.
default_trait_access = "allow"
# Explicit boolean forms that mirror the spec text they implement.
nonminimal_bool = "allow"
# Explicit .into() kept at boundaries where the source type may change.
useless_conversion = "allow"
# Boxed returns keep the trait-object shape stable across backends.
unnecessary_box_returns = "allow"
# Field prefixes/suffixes carry meaning in these record types.
struct_field_names = "allow"
# Explicit owned copies at API boundaries.
unnecessary_to_owned = "allow"
# Uniform &T signatures across a trait family.
trivially_copy_pass_by_ref = "allow"
# Values bounded by construction.
cast_possible_wrap = "allow"
# Values bounded by construction.
cast_sign_loss = "allow"
# Hashes and masks are more readable unseparated.
unreadable_literal = "allow"
# Range-like types where an is_empty would be meaningless.
len_without_is_empty = "allow"
# fgit-chronicle drives its futures on a local executor; requiring Send would force
# needless synchronisation.
future_not_send = "allow"
# Lock guards deliberately span the whole critical section here.
significant_drop_tightening = "allow"
# Domain nouns that genuinely resemble each other (head/held, ref/refs).
similar_names = "allow"
# Builder-style setup after Default::default() reads clearly.
field_reassign_with_default = "allow"
# Catch-alls kept so new variants keep compiling.
match_wildcard_for_single_variants = "allow"
# Err(_) catch-alls where the error payload is deliberately unused.
match_wild_err_arm = "allow"
# Rich domain variants; boxing would hide the shape callers match on.
large_enum_variant = "allow"
# Argument construction is cheap at these sites.
or_fun_call = "allow"
# False positive on deliberate asymmetric comparisons.
suspicious_operation_groupings = "allow"
# New lint; asks for assert_eq!(x, "") on plain emptiness assertions.
assert_is_empty = "allow"
# Redundant #[must_use] on already-must_use types; cosmetic.
double_must_use = "allow"
# Domain error enums here are intentionally rich; boxing them would hide the variant
# shape that callers match on.
result_large_err = "allow"
# Arms kept separate where they document distinct cases.
match_same_arms = "allow"
# Deliberate catch-alls that must keep compiling as variants are added.
wildcard_enum_match_arm = "allow"
# Sets modelled as maps where the value slot is reserved for future payloads.
zero_sized_map_values = "allow"
# Style preference between if-let/else and Option::map_or.
option_if_let_else = "allow"
# usize->u32 casts on values already bounded by construction.
cast_possible_truncation = "allow"
# Doc prose shape only.
too_long_first_doc_paragraph = "allow"
# Uninhabited marker enums are a deliberate type-level device here.
empty_enums = "allow"
# Asks for backticks around bare identifiers in prose; purely presentational.
doc_markdown = "allow"
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
missing_errors_doc = { level = "allow", priority = 1 }
missing_panics_doc = { level = "allow", priority = 1 }
too_many_lines = { level = "allow", priority = 1 }
items_after_statements = { level = "allow", priority = 1 }
manual_let_else = { level = "allow", priority = 1 }
map_unwrap_or = { level = "allow", priority = 1 }
redundant_closure_for_method_calls = { level = "allow", priority = 1 }
uninlined_format_args = { level = "allow", priority = 1 }
needless_collect = { level = "allow", priority = 1 }
needless_pass_by_value = { level = "allow", priority = 1 }
explicit_iter_loop = { level = "allow", priority = 1 }
format_collect = { level = "allow", priority = 1 }
single_match_else = { level = "allow", priority = 1 }
too_many_arguments = { level = "allow", priority = 1 }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.release-perf]
inherits = "release"
lto = "thin"
debug = "line-tables-only"
strip = false
