# FrankenGit workspace.
# Engine crates enter only with a real vertical slice; no placeholder crates.
# Every directory under crates/ is a workspace member via the glob, so it MUST be a complete
# crate: create src/lib.rs (with #![forbid(unsafe_code)]) BEFORE Cargo.toml, and add the
# crate's [workspace.dependencies] path entry below in the same commit.

[workspace]
resolver = "3"
members = ["crates/*", "tools/registry-check"]
default-members = ["crates/*", "tools/registry-check"]

[workspace.package]
edition = "2024"
license-file = "LICENSE"
repository = "https://github.com/Dicklesworthstone/frankengit"

# First-party workspace members are wired by path in exactly one place, so
# every consumer writes `fgit-types.workspace = true` and no crate invents its
# own relative path. This is the layered first-party crate DAG of the plan's
# prospective implementation architecture, admitted by DEP-013 (`fgit-*`,
# allow_first_party) — not the unpublished external path dependency that
# AGENTS.md section 3.3 forbids for a release-facing crate.
[workspace.dependencies]
# The sole async runtime (AGENTS.md 3.2, registries/dependency_policy.tsv DEP-001),
# aliased here so a crate can inherit the one pinned version instead of
# repeating it. Must stay equal to the version the crates that name it
# directly already pin, and to the entry in Cargo.lock.
asupersync = { version = "0.4.9", default-features = false }
# Reused cryptographic primitives, admitted for direct first-party use by
# ADR-0003 Amendment 1 (D8). `default-features = false` is load-bearing rather
# than tidy: the default sets add dependency edges (`zeroize` for
# ed25519-dalek, `getrandom` via aead for chacha20poly1305) and would move
# Cargo.lock for every agent sharing this checkout. Signing keys are derived
# through HKDF in fgit-crypto, so in-crate key generation is not needed.
chacha20poly1305 = { version = "0.11.0", default-features = false }
ed25519-dalek = { version = "2.2.0", default-features = false }
fgit-admission = { path = "crates/fgit-admission" }
fgit-authority = { path = "crates/fgit-authority" }
fgit-authority-fsqlite = { path = "crates/fgit-authority-fsqlite" }
fgit-chronicle = { path = "crates/fgit-chronicle" }
fgit-codec = { path = "crates/fgit-codec" }
fgit-crypto = { path = "crates/fgit-crypto" }
fgit-deflate = { path = "crates/fgit-deflate" }
fgit-diff = { path = "crates/fgit-diff" }
fgit-doc = { path = "crates/fgit-doc" }
fgit-git-object = { path = "crates/fgit-git-object" }
fgit-lab = { path = "crates/fgit-lab" }
fgit-node = { path = "crates/fgit-node" }
fgit-object-fabric = { path = "crates/fgit-object-fabric" }
fgit-pack = { path = "crates/fgit-pack" }
fgit-raptorq = { path = "crates/fgit-raptorq" }
fgit-reference = { path = "crates/fgit-reference" }
fgit-resource = { path = "crates/fgit-resource" }
fgit-runtime = { path = "crates/fgit-runtime" }
fgit-txn = { path = "crates/fgit-txn" }
fgit-types = { path = "crates/fgit-types" }
fgit-wire = { path = "crates/fgit-wire" }
fgit-cli = { path = "crates/fgit-cli" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
missing_errors_doc = { level = "allow", priority = 1 }
missing_panics_doc = { level = "allow", priority = 1 }
too_many_lines = { level = "allow", priority = 1 }
items_after_statements = { level = "allow", priority = 1 }
manual_let_else = { level = "allow", priority = 1 }
map_unwrap_or = { level = "allow", priority = 1 }
redundant_closure_for_method_calls = { level = "allow", priority = 1 }
uninlined_format_args = { level = "allow", priority = 1 }
needless_collect = { level = "allow", priority = 1 }
needless_pass_by_value = { level = "allow", priority = 1 }
explicit_iter_loop = { level = "allow", priority = 1 }
format_collect = { level = "allow", priority = 1 }
single_match_else = { level = "allow", priority = 1 }
too_many_arguments = { level = "allow", priority = 1 }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.release-perf]
inherits = "release"
lto = "thin"
debug = "line-tables-only"
strip = false
