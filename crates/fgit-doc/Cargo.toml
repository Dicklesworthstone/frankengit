[package]
name = "fgit-doc"
version = "0.0.0"
edition.workspace = true
license-file.workspace = true
repository.workspace = true
publish = false
description = "Source-spanned safe document parsing, review anchors, and deterministic render profiles."

[lints]
workspace = true

[dependencies]

# One integration binary rather than one per group: the shared corpus and
# invariant helpers are then used by the crate that compiles them, so no group
# needs a dead-code exemption for the helpers it happens not to call.
[[test]]
name = "suite"
path = "tests/suite/main.rs"
