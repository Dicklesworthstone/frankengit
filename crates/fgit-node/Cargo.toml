[package]
name = "fgit-node"
version = "0.0.1"
edition.workspace = true
license-file.workspace = true
repository.workspace = true
publish = false
description = "One-process FrankenGit node assembly over published subsystem contracts."

[dependencies]
fgit-admission.workspace = true
fgit-authority.workspace = true
fgit-authority-fsqlite.workspace = true
fgit-chronicle.workspace = true
fgit-codec.workspace = true
fgit-crypto.workspace = true
fgit-git-object.workspace = true
fgit-object-fabric.workspace = true
fgit-pack.workspace = true
fgit-resource.workspace = true
fgit-runtime.workspace = true
fgit-reference.workspace = true
fgit-txn.workspace = true
fgit-types.workspace = true
fgit-verified-read.workspace = true
fgit-wire.workspace = true
# This names the FrankenSQLite context held for the authority store lifetime.
# It is already in the admitted fsqlite authority closure (DEP-202), so this
# direct edge adds no new dependency surface.
fsqlite-types = { version = "0.3.7", default-features = false, features = ["native"] }

[lints]
workspace = true
