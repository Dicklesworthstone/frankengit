[package]
name = "fgit-cli"
version = "0.0.1"
default-run = "fg"
edition.workspace = true
license-file.workspace = true
repository.workspace = true
publish = false
description = "Minimal FrankenGit node command-line interface."

[[bin]]
name = "fg"
path = "src/main.rs"

[[bin]]
name = "fg-mcp"
path = "src/bin/fg-mcp.rs"

[dependencies]
fgit-authority.workspace = true
fgit-codec.workspace = true
fgit-crypto.workspace = true
fgit-forge.workspace = true
fgit-identity.workspace = true
fgit-node.workspace = true
fgit-ssh.workspace = true
fgit-types.workspace = true

[lints]
workspace = true
