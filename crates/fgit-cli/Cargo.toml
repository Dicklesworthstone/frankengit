[package]
name = "fgit-cli"
version = "0.0.1"
default-run = "fg"
edition.workspace = true
license-file.workspace = true
repository.workspace = true
publish = false
description = "Minimal FrankenGit node command-line interface."

[[bin]]
name = "fg"
path = "src/main.rs"

[[bin]]
name = "fg-mcp"
path = "src/bin/fg-mcp.rs"

[dependencies]
fgit-admission.workspace = true
fgit-agent.workspace = true
fgit-authority.workspace = true
fgit-claim.workspace = true
fgit-codec.workspace = true
fgit-crypto.workspace = true
fgit-evidence.workspace = true
fgit-forge.workspace = true
fgit-identity.workspace = true
fgit-node.workspace = true
fgit-object-fabric.workspace = true
fgit-resource.workspace = true
fgit-schema.workspace = true
fgit-ssh.workspace = true
fgit-types.workspace = true
fgit-verified-read.workspace = true
fgit-wire.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
fgit-runner.workspace = true

[target.'cfg(unix)'.dependencies]
# DEP-118: private token reads reject symlinks/FIFOs before reading.
# Reuses the admitted std/fs capability without new packages or features.
rustix.workspace = true

[dev-dependencies]
fgit-authority-fsqlite.workspace = true
fgit-git-object.workspace = true
fgit-pack.workspace = true
fgit-treefs.workspace = true

[lints]
workspace = true
