[package]
name = "fgit-lab"
version = "0.0.1"
edition.workspace = true
license-file.workspace = true
repository.workspace = true
publish = false
description = "FrankenGit deterministic protocol laboratory: virtual time, seeded entropy, enumerable failpoints, controlled schedules, composed fault models, and byte-identical logical traces."

[dependencies]
asupersync = { version = "0.4.9", default-features = false }
fgit-authority.workspace = true
fgit-resource.workspace = true
fgit-runtime.workspace = true

# Integration tests instantiate the real typed reservation/receipt payloads,
# whose fields are fgit-types identifiers. An integration test cannot import a
# transitive dependency, so the edge has to be declared -- but only for tests:
# fgit-lab's own src does not use fgit-types, and a regular dependency would
# put it in the PRODUCTION graph for no reason.
[dev-dependencies]
fgit-types.workspace = true

[lints]
workspace = true
