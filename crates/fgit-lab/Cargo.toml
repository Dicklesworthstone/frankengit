[package]
name = "fgit-lab"
version = "0.0.1"
edition.workspace = true
license-file.workspace = true
repository.workspace = true
publish = false
description = "FrankenGit deterministic protocol laboratory: virtual time, seeded entropy, enumerable failpoints, controlled schedules, composed fault models, and byte-identical logical traces."

[dependencies]
asupersync = { version = "0.4.9", default-features = false }
fgit-authority.workspace = true
fgit-resource.workspace = true
fgit-runtime.workspace = true

# Integration tests consume the L1 crypto lifecycle surface and instantiate
# real typed reservation/receipt payloads whose fields are fgit-types
# identifiers. An integration test cannot import transitive dependencies, so
# both edges are test-only: fgit-lab's own src uses neither, and regular
# dependencies would put them in the PRODUCTION graph for no reason.
[dev-dependencies]
fgit-admission.workspace = true
fgit-chronicle.workspace = true
fgit-codec.workspace = true
fgit-crypto.workspace = true
fgit-forge.workspace = true
fgit-reference.workspace = true
fgit-txn.workspace = true
fgit-types.workspace = true
fgit-wire.workspace = true

[lints]
workspace = true
